apply plugin: 'com.android.application'

android {
    namespace = "com.elsa.laundry"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.elsa.laundry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and directories omitted from the packaged assets directory.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        /*
         * Debug signing configuration.
         * This is only for debug/testing builds.
         */
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        /*
         * Release signing configuration.
         *
         * The following files must exist only on the private computer used
         * to build the release:
         *
         * android/keystore.properties
         * android/app/elsa-upload-key.jks
         *
         * Do not upload either file to GitHub.
         */
        release {
            def keystorePropertiesFile = rootProject.file('keystore.properties')

            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(
                    new FileInputStream(keystorePropertiesFile)
                )

                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.release

            proguardFiles(
                getDefaultProguardFile('proguard-android.txt'),
                'proguard-rules.pro'
            )
        }
    }
}

